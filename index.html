  <style>
    .preloader-1 {
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 1000;
      background-color: #000;
    }

    /* .preloader-1 .title {

    .preloader-1 .face {
      width: 20vw;
      height: 20vw;
      background-color: var(--color-green-light);
      border-radius: 15vw;
      position: relative;
      overflow: hidden;
      animation: rotation 6.25s linear forwards;
    }

    @keyframes rotation {
      0% {
        transform: translateY(50vh) scale(.4);
      }

      70% {
        opacity: 0;
      }

      100% {
        transform: translateY(0vh) scale(1);
        opacity: 0;
      }
    }

    .preloader-1 .eye {
      position: absolute;
      background-color: #0f0f0f;
      top: 4.5vw;
      height: 3.6vw;
      border-radius: 3vw;
    }

    .preloader-1 .eye-1 {
      width: 6.4vw;
      left: 3.5vw;
    }

    .preloader-1 .eye-2 {
      width: 5.7vw;
      right: 3.5vw;
    }

    @media only screen and (max-width: 1400px) {
      .preloader-1 .face {
        width: 330px;
        height: 330px;
        border-radius: 190px;
      }

      .preloader-1 .eye {
        top: 85px;
        height: 60px;
        border-radius: 30px;
      }

      .preloader-1 .eye-1 {
        width: 100px;
        left: 61px;
      }

      .preloader-1 .eye-2 {
        width: 90px;
        right: 61px;
      }
    }

    .hidden {
      position: absolute;
      top: 0;
      left: -99999999px;
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>

<body style="background-color: #000;">
  <div id="app" style="background-color: #000;"></div>
  <div class="preloader-1">
    <div class="face">
      <div class="eye eye-1"></div>
      <div class="eye eye-2"></div>
    </div>
  </div>
  <div class="hidden">
